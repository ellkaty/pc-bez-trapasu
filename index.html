<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PC bez trapasu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500;700&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: lepicí horní lišta, uprostřed sloupec max 980px.
   Domů = hero s hledáním + dlaždice témat. Téma = barevná hlavička, odkazy na sekce, sekce, mini-kvíz. */
:root{
  --bg:#f2f4fa; --card:#ffffff; --ink:#141a30; --mute:#4b5472; --line:#141a30; --shadow:#141a30;
  --soft:#e7eaf5; --accent:#ffd43b; --accent-ink:#141a30; --focus:#2f5bff;
  --good:#10905c; --good-bg:#d4f3e4; --bad:#d6343a; --bad-bg:#ffdadb; --warn-bg:#fff0c2; --info-bg:#dbeaff;
  --t1:#ffe9a8; --t2:#c4e8ff; --t3:#ffd0da; --t4:#c9f1da; --t5:#e2d6ff; --t6:#ffdcbd;
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1020; --card:#171b31; --ink:#eef0ff; --mute:#a9b0d4; --line:#7c85b8; --shadow:#04050d;
    --soft:#232844; --accent:#ffd43b; --accent-ink:#141a30; --focus:#8fb0ff;
    --good:#3ddc97; --good-bg:#12392b; --bad:#ff7478; --bad-bg:#4a1c20; --warn-bg:#3f3412; --info-bg:#172c4f;
    --t1:#4a3e12; --t2:#173f59; --t3:#52243a; --t4:#17503a; --t5:#3b2e6b; --t6:#57381a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1020; --card:#171b31; --ink:#eef0ff; --mute:#a9b0d4; --line:#7c85b8; --shadow:#04050d;
  --soft:#232844; --accent:#ffd43b; --accent-ink:#141a30; --focus:#8fb0ff;
  --good:#3ddc97; --good-bg:#12392b; --bad:#ff7478; --bad-bg:#4a1c20; --warn-bg:#3f3412; --info-bg:#172c4f;
  --t1:#4a3e12; --t2:#173f59; --t3:#52243a; --t4:#17503a; --t5:#3b2e6b; --t6:#57381a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65;margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:.7em 0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;min-width:0}
.hl{background:linear-gradient(transparent 60%,var(--accent) 90%,var(--accent) 92%,transparent 92%);padding:0 .12em}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:0 0 .5rem}
.mute{color:var(--mute)}
[hidden]{display:none!important}
html[data-os="win"] [data-only="mac"],html[data-os="mac"] [data-only="win"]{display:none!important}

/* ---------- horní lišta ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:2px solid var(--line)}
.top-in{display:flex;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;padding-block:.65rem;max-width:1000px;margin:0 auto}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:1.25rem;white-space:nowrap}
.keycap{display:inline-grid;place-items:center;min-width:2.4rem;height:2.4rem;padding:0 .5rem;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);border-bottom-width:5px;border-radius:9px;font-family:var(--f-mono);font-weight:700;font-size:1rem}
.tools{display:flex;gap:.5rem;align-items:center;margin-left:auto;flex-wrap:wrap}
.search{position:relative;flex:1 1 260px;min-width:0;order:2}
.search input{width:100%;padding:.62rem .9rem .62rem 2.5rem;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:1rem;min-width:0}
.search .sico{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1.2rem;height:1.2rem;pointer-events:none;color:var(--mute)}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--card);border:2px solid var(--line);border-radius:12px;box-shadow:5px 5px 0 var(--shadow);max-height:min(70vh,520px);overflow:auto;z-index:80;padding:.35rem}
.results a{display:block;text-decoration:none;padding:.55rem .7rem;border-radius:8px}
.results a small{display:block;color:var(--mute);font-size:.85rem;line-height:1.35}
.results a b{font-family:var(--f-display);font-weight:600}
.results a.on,.results a:hover{background:var(--accent);color:var(--accent-ink)}
.results a.on small,.results a:hover small{color:var(--accent-ink)}
.results .none{padding:.8rem;color:var(--mute)}
@media (min-width:900px){.search{order:0}}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border:2px solid var(--line);border-radius:10px;background:var(--card);box-shadow:3px 3px 0 var(--shadow);font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .08s,box-shadow .08s;line-height:1.2}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.small{padding:.3rem .65rem;font-size:.85rem;box-shadow:2px 2px 0 var(--shadow)}
.btn[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:.42rem .7rem;font-weight:700;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.xp{font-family:var(--f-mono);font-weight:700;font-size:.9rem;padding:.35rem .6rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);white-space:nowrap}

/* ---------- menu (rozklikávací obsah) ---------- */
.menu{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px)}
.menu-in{max-width:760px;margin:0 auto}
.menu-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1rem}
.menu h2{font-size:1.8rem}
.menu details{border:2px solid var(--line);border-radius:var(--r);background:var(--card);margin:.7rem 0;box-shadow:4px 4px 0 var(--shadow)}
.menu summary{cursor:pointer;padding:.8rem 1rem;font-family:var(--f-display);font-weight:800;font-size:1.15rem;list-style:none;display:flex;align-items:center;gap:.6rem}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:"+";margin-left:auto;font-family:var(--f-mono);font-size:1.3rem}
.menu details[open]>summary::after{content:"−"}
.menu details details{box-shadow:none;border-width:1.5px;margin:.4rem .6rem;background:var(--bg)}
.menu details details summary{font-size:1rem;font-weight:700;font-family:var(--f-body)}
.menu .sub{display:flex;flex-direction:column;padding:0 1rem .8rem 1rem;gap:.1rem}
.menu .sub a{padding:.3rem .5rem;border-radius:6px;text-decoration:none;color:var(--mute)}
.menu .sub a:hover{background:var(--accent);color:var(--accent-ink)}
.menu .sub a.open{font-weight:800;color:var(--ink)}
.ico{width:1.5em;height:1.5em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- domů ---------- */
main{padding-block:1.5rem 3rem;outline:none}
.hero{padding-block:1.2rem 1.6rem}
.hero h1{font-size:clamp(2.6rem,8vw,5.2rem);font-weight:800;letter-spacing:-.03em}
.hero .sub{font-size:clamp(1.05rem,2.4vw,1.3rem);max-width:36em;color:var(--mute);margin:1rem 0 1.4rem}
.hero .search{flex:none;max-width:640px;width:100%}
.hero .search input{padding:1rem 1rem 1rem 3rem;font-size:1.15rem;border-radius:14px;background:var(--card);box-shadow:5px 5px 0 var(--shadow)}
.hero .search .sico{left:1rem;width:1.5rem;height:1.5rem}
.hero .results{top:calc(100% + 10px)}
.pops{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem;align-items:center}
.pops span{font-size:.85rem;color:var(--mute);font-weight:700}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.2rem .75rem;font-size:.9rem;font-weight:700;text-decoration:none;cursor:pointer}
.chip:hover{background:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.kecho{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem;min-height:3.4rem;padding:.6rem .9rem;border:2px dashed var(--line);border-radius:var(--r);max-width:640px;background:var(--card)}
.kecho .hintt{color:var(--mute);font-weight:600}
.kecho .what{font-weight:800}
.prog{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.2rem 0 2rem;padding:.9rem 1.1rem;border:2px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:4px 4px 0 var(--shadow)}
.prog .bar{flex:1 1 180px;height:16px;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}
.prog .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.cat{margin-block:2.4rem}
.cat h2{font-size:1.7rem;display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.cat h2 small{font-family:var(--f-mono);font-size:.8rem;font-weight:500;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem;margin-top:1rem}
.tile{display:flex;flex-direction:column;gap:.5rem;padding:1rem;border:2px solid var(--line);border-radius:var(--r);background:var(--tint,var(--t1));box-shadow:4px 4px 0 var(--shadow);text-decoration:none;position:relative;min-width:0;transition:transform .1s,box-shadow .1s}
.tile:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.tile .ti{width:2.7rem;height:2.7rem;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);border-radius:10px}
.tile h3{font-size:1.2rem}
.tile p{margin:0;font-size:.93rem;line-height:1.45}
.tile .done{position:absolute;top:.7rem;right:.7rem;background:var(--good);color:#fff;border-radius:99px;width:1.6rem;height:1.6rem;display:grid;place-items:center;font-weight:800;font-size:.9rem;border:2px solid var(--line)}
.tipday{margin-top:2.5rem;padding:1.2rem;border:2px solid var(--line);border-radius:var(--r);background:var(--accent);color:var(--accent-ink);box-shadow:5px 5px 0 var(--shadow);display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.tipday b{font-family:var(--f-display);font-size:1.2rem}
.tipday p{margin:.2rem 0 0;flex:1 1 280px}
.tipday .btn{background:var(--card);color:var(--ink)}

/* ---------- stránka tématu ---------- */
.back{display:inline-block;margin-bottom:1rem;font-weight:800;text-decoration:none;color:var(--mute)}
.back:hover{color:var(--ink)}
.phead{display:flex;gap:1.2rem;align-items:flex-start;padding:1.4rem;border:2px solid var(--line);border-radius:var(--r);background:var(--tint,var(--t1));box-shadow:6px 6px 0 var(--shadow)}
.phead .pico{width:4rem;height:4rem;flex:none;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px}
.phead .pico .ico{width:2.1rem;height:2.1rem}
.phead h1{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:800}
.phead .lead{font-size:1.12rem;margin:.6rem 0 0;max-width:38em}
.phead>div{min-width:0}
@media (max-width:560px){.phead{flex-direction:column;padding:1.1rem}}
.onpage{display:flex;gap:.5rem;overflow-x:auto;padding:1rem 2px .6rem;align-items:center;scrollbar-width:thin}
.onpage span{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);flex:none}
.onpage a{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:.2rem .8rem;font-size:.9rem;font-weight:700;text-decoration:none;white-space:nowrap}
.onpage a:hover{background:var(--accent);color:var(--accent-ink)}
.sec{margin-block:2.6rem;scroll-margin-top:150px;min-width:0}
.sec h2{font-size:clamp(1.5rem,3.5vw,2rem);margin-bottom:.8rem}
.sec h3{font-size:1.2rem;margin:1.4rem 0 .3rem}
.sec ul,.sec ol{padding-left:1.3rem;margin:.7em 0}
.sec li{margin:.3em 0}
.sec li::marker{color:var(--mute);font-weight:800}
.page,.sec>*{min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin-block:1rem}
.box{border:2px solid var(--line);border-radius:var(--r);padding:.9rem 1.1rem;background:var(--card)}
.box h3{margin-top:0}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.note{display:flex;gap:.8rem;padding:.85rem 1rem;border:2px solid var(--line);border-radius:var(--r);margin-block:1.1rem;background:var(--info-bg)}
.note>b{flex:none;font-family:var(--f-display);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;padding-top:.2rem;min-width:3.5rem}
.note>div{min-width:0}
.note>div>:first-child{margin-top:0}.note>div>:last-child{margin-bottom:0}
.note.tip{background:var(--good-bg)}
.note.warn{background:var(--bad-bg)}
.note.fact{background:var(--warn-bg)}
@media (max-width:520px){.note{flex-direction:column;gap:.1rem}}
kbd{display:inline-block;font-family:var(--f-mono);font-weight:700;font-size:.85em;padding:.12em .5em;border:2px solid var(--line);border-bottom-width:4px;border-radius:7px;background:var(--card);color:var(--ink);line-height:1.25;white-space:nowrap}
.keys{display:inline-flex;align-items:center;gap:.25rem;flex-wrap:wrap}
.keys i{font-style:normal;color:var(--mute);font-weight:800}
.keys .or{font-size:.8em;color:var(--mute);margin:0 .3rem;font-weight:700}
code{overflow-wrap:anywhere;font-family:var(--f-mono);font-size:.88em;background:var(--soft);padding:.1em .4em;border-radius:5px}
.steps{list-style:none;counter-reset:s;padding:0!important;display:grid;gap:.7rem}
.steps li{counter-increment:s;display:flex;gap:.85rem;align-items:flex-start;margin:0}
.steps li::before{content:counter(s);flex:none;width:2rem;height:2rem;display:grid;place-items:center;border:2px solid var(--line);border-radius:99px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.steps li>div{min-width:0;padding-top:.1rem}
.tblwrap{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:var(--card);margin-block:1rem}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:.6rem .8rem;text-align:left;vertical-align:top;border-bottom:1.5px solid var(--soft)}
th{font-family:var(--f-display);font-size:.9rem;background:var(--soft);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.ext{font-family:var(--f-mono);font-weight:700}
.os-label{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:1.1rem 0 .2rem}

/* ---------- widget ---------- */
.widget{border:2px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:5px 5px 0 var(--shadow);padding:1rem 1.1rem 1.2rem;margin-block:1.3rem;min-width:0;position:relative}
.wlabel{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);border-radius:7px;padding:.1rem .55rem;margin:-1.55rem 0 .7rem -.2rem;transform:rotate(-1.5deg)}
.wbody{min-width:0}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.meter{height:18px;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}
.meter i{display:block;height:100%;background:var(--good);transition:width .6s,background .4s}
.meter.bad i{background:var(--bad)}.meter.mid i{background:var(--warn,#f59f00)}
.lab{display:flex;justify-content:space-between;gap:1rem;font-size:.85rem;font-weight:800;margin:.7rem 0 .25rem}
.say{margin:.9rem 0 0;padding:.7rem .9rem;border-radius:10px;background:var(--soft);min-height:3.2em}
.big{font-family:var(--f-display);font-size:2.6rem;font-weight:800;line-height:1}
input[type=range]{width:100%;accent-color:var(--ink)}
.field{display:grid;gap:.25rem;margin-block:.6rem}
.field label{font-weight:800;font-size:.9rem}
.field input[type=text],.field input[type=search],.field textarea,.field select,input.inp{width:100%;padding:.55rem .75rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.field textarea{min-height:9rem;resize:vertical;line-height:1.5}
.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}
.checks{list-style:none;padding:0!important;display:grid;gap:.3rem}
.checks li{display:flex;gap:.55rem;margin:0}
.checks li::before{content:"✗";color:var(--bad);font-weight:800;flex:none;width:1.2rem}
.checks li.pass::before{content:"✓";color:var(--good)}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s}

/* kvíz */
.qhead{display:flex;align-items:center;gap:1rem;font-weight:800;font-size:.85rem;color:var(--mute)}
.qbar{flex:1;height:10px;border:2px solid var(--line);border-radius:99px;overflow:hidden;background:var(--bg)}
.qbar i{display:block;height:100%;background:var(--accent)}
.qtext{font-family:var(--f-display);font-weight:600;font-size:1.3rem;margin:.9rem 0}
.qmock{margin-top:.9rem}
.opts{display:grid;gap:.6rem}
.opt{text-align:left;padding:.7rem .95rem;border:2px solid var(--line);border-radius:12px;background:var(--bg);box-shadow:3px 3px 0 var(--shadow);font-weight:600;transition:transform .08s}
.opt:hover:not([disabled]){transform:translate(-1px,-1px);background:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.qfb{margin-top:.9rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.qfb p{margin:0;flex:1 1 260px}
.qdone{text-align:center;padding:1rem}
.mock{border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:.8rem 1rem;font-size:.95rem;line-height:1.5}
.mock .from{font-size:.8rem;color:var(--mute);font-weight:700;margin-bottom:.3rem;word-break:break-word}
.mock .lnk{color:var(--focus);text-decoration:underline;word-break:break-all}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:3rem}
.pn a{display:block;padding:1rem;border:2px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:4px 4px 0 var(--shadow);text-decoration:none;min-width:0}
.pn a:hover{background:var(--accent);color:var(--accent-ink)}
.pn small{display:block;color:var(--mute);font-weight:800;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.pn a:hover small{color:var(--accent-ink)}
.pn a:last-child{text-align:right}
.pn b{font-family:var(--f-display);font-size:1.15rem}

/* simulátor klikání */
.sim{border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.simbar{display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;background:var(--ink);color:var(--bg);font-size:.85rem}
.simbar .dots{display:flex;gap:4px}.simbar .dots i{width:10px;height:10px;border-radius:50%;background:var(--bg);opacity:.5}
.simbar .stepno{margin-left:auto;font-family:var(--f-mono)}
.simhint{padding:.8rem 1rem 0;margin:0;font-weight:700}
.simitems{display:flex;flex-wrap:wrap;gap:.6rem;padding:.8rem 1rem 1rem}
.simitem{padding:.55rem .9rem;border:2px solid var(--line);border-radius:8px;background:var(--card);font-weight:600;text-align:left;box-shadow:2px 2px 0 var(--shadow)}

.simitems.list .simitem{width:100%}
.simitem.hint{animation:hintp 1s infinite}
@keyframes hintp{50%{background:var(--accent);color:var(--accent-ink)}}
.simfb{margin:0;padding:0 1rem .9rem;min-height:1.6em;font-weight:700}
.simdone{padding:1.4rem;text-align:center}

/* okno-simulace */
.stage{position:relative;height:330px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(135deg,var(--t2),var(--t5));touch-action:none;user-select:none}
.fwin{position:absolute;left:30px;top:24px;width:260px;height:170px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;flex-direction:column;box-shadow:5px 5px 0 var(--shadow);overflow:hidden}
.fwin.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 38px)!important;border-radius:0}
.ftitle{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;background:var(--soft);cursor:grab;border-bottom:2px solid var(--line);font-size:.85rem;font-weight:700}
.ftitle span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb{width:26px;height:22px;border:2px solid var(--line);border-radius:6px;background:var(--card);font-size:.8rem;line-height:1;padding:0;font-weight:800}
.fb.x:hover{background:var(--bad);color:#fff}.fb:hover{background:var(--accent);color:var(--accent-ink)}
.fbody{padding:.6rem .8rem;font-size:.85rem;flex:1;overflow:hidden}
.ftask{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--ink);display:flex;align-items:center;gap:.5rem;padding:0 .6rem}

.ftask button.act{background:var(--accent);color:var(--accent-ink)}
.ftask button.glow{animation:hintp 1s infinite}
.ftask .clk{margin-left:auto;color:var(--bg);font-family:var(--f-mono);font-size:.8rem}

/* snímek obrazovky */
.shot{position:relative;height:240px;border:2px solid var(--line);border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none;background:var(--t2)}
.shot .sel{position:absolute;border:2px dashed #fff;outline:2px solid #000;box-shadow:0 0 0 9999px rgba(0,0,0,.5);display:none;pointer-events:none}
.mockscr{position:absolute;inset:0;padding:14px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-content:start}
.mockscr .a{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:8px;font-size:.8rem;height:100px}
.mockscr .b{background:var(--accent);color:var(--accent-ink);border:2px solid var(--line);border-radius:8px;padding:8px;font-weight:800;height:100px}
.mockscr .c{grid-column:1/-1;background:var(--bad-bg);border:2px solid var(--line);border-radius:8px;padding:8px;font-family:var(--f-mono);font-size:.8rem;height:70px}
.shotprev{display:none;margin-top:.8rem}
.shotprev .frame{position:relative;overflow:hidden;border:2px solid var(--line);background:var(--card);max-width:100%}
.shotprev .frame>div{position:absolute;left:0;top:0;width:var(--sw);height:var(--sh)}

/* třídění souborů */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-top:.9rem}
.bin{padding:.7rem .5rem;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:800;box-shadow:3px 3px 0 var(--shadow);text-align:center}

.bin:hover{background:var(--accent);color:var(--accent-ink)}

.curfile{display:flex;align-items:center;justify-content:center;gap:1rem;padding:1.2rem;border:2px dashed var(--line);border-radius:12px;font-family:var(--f-mono);font-size:1.5rem;font-weight:700;flex-wrap:wrap;word-break:break-all;text-align:center}

/* tabulka-sheet */
.sheet{overflow-x:auto;border:2px solid var(--line);border-radius:10px;background:var(--card)}
.sheet table{min-width:480px;table-layout:fixed}

/* ¶ demo */
.paper{background:#fff;color:#1b1f33;border:2px solid var(--line);border-radius:6px;padding:1.2rem 1.4rem;font-family:'Times New Roman',Georgia,serif;font-size:1.02rem;line-height:1.45;min-height:15rem;overflow-x:auto}

.paper h4{margin:0;font-size:1.5rem}

/* slide */
.slide{aspect-ratio:16/9;border:2px solid var(--line);border-radius:8px;padding:5%;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.4rem;transition:all .3s}

.slide.good h5{font-size:clamp(1.3rem,4vw,2.3rem);margin:0;color:#ffd43b;line-height:1.05}

.inst{border:2px solid var(--line);border-radius:10px;background:var(--bg);padding:1rem}

.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.part{padding:.6rem;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:.2rem;box-shadow:3px 3px 0 var(--shadow)}
.part[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pdetail{margin-top:1rem;padding:1rem;border:2px solid var(--line);border-radius:12px;background:var(--soft)}
.pdetail h3{margin:0 0 .3rem}
.tree .q{font-family:var(--f-display);font-size:1.4rem;font-weight:600;margin:.6rem 0 1rem}

.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.8rem;margin-top:1rem}
.gcard{perspective:800px;border:0;background:none;padding:0;text-align:left;min-height:150px}
.gcard>span{display:flex;flex-direction:column;justify-content:center;gap:.3rem;height:100%;min-height:150px;padding:.9rem;border:2px solid var(--line);border-radius:12px;background:var(--card);box-shadow:4px 4px 0 var(--shadow);transition:background .15s}
.gcard b{font-family:var(--f-display);font-size:1.25rem}
.gcard small{color:var(--mute);font-weight:700}
.gcard[aria-pressed="true"]>span{background:var(--t1)}

.gcard[aria-pressed="true"] small{display:none}
.gcard .def{display:none;font-size:.93rem;line-height:1.45}

.ring{width:150px;height:150px;position:relative;margin:.4rem auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}

.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:200;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{margin-top:3rem;padding-block:2rem 3rem;border-top:2px solid var(--line);color:var(--mute);font-size:.9rem;text-align:center}
.urlx{font-family:var(--f-mono);font-size:.95rem;word-break:break-all;padding:.8rem 1rem;background:var(--soft);border-radius:10px}
.urlx .s{color:var(--mute)}.urlx .d{background:var(--accent);color:var(--accent-ink);padding:0 .15em;border-radius:4px;font-weight:700}.urlx .p{color:var(--focus)}
.big-emoji{font-size:2rem}
details.acc{border:2px solid var(--line);border-radius:12px;background:var(--card);margin:.6rem 0}

<script>
(function () {
'use strict';
/* =========================================================
   PC bez trapasu – jádro: pomocné funkce, router, hledání, menu
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const memS = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('pcbt:' + k); if (v !== null) return JSON.parse(v); } catch (e) {} return k in memS ? memS[k] : d; },
  set(k, v) { memS[k] = v; try { localStorage.setItem('pcbt:' + k, JSON.stringify(v)); } catch (e) {} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const strip = h => h.replace(/<[^>]+>/g, ' ').replace(/&[a-z#0-9]+;/g, ' ').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rootEl = document.documentElement;

/* ---------- ikony (jednoduché obrysové) ---------- */
const ICONS = {
  power: '<path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  keyboard: '<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
  folder: '<path d="M3 6h6l2 2h10v11H3z"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  wifi: '<path d="M2 9a15 15 0 0 1 20 0M5 13a10 10 0 0 1 14 0M8.5 16.5a5 5 0 0 1 7 0"/><path d="M12 20h.01"/>',
  shot: '<path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/><rect x="8" y="9" width="8" height="6" rx="1"/>',
  question: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/>',
  gauge: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 10a4 4 0 0 1 0 8z"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>',
  shield: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16M15 4v16"/>',
  window: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M6.5 6.5h.01M9 6.5h.01"/>',
  printer: '<path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  drive: '<rect x="3" y="12" width="18" height="8" rx="2"/><path d="M7 16h.01M11 16h.01M6 12l2-8h8l2 8"/>',
  pencil: '<path d="M4 20l1-5L16 4l4 4L9 19z"/>',
  slides: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/>',
  spark: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  download: '<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  wrench: '<path d="M14.5 6.5a4 4 0 0 0 5 5L10 21a2.1 2.1 0 0 1-3-3z"/><path d="M14.5 6.5a4 4 0 0 1 5-3l-2.5 2.5 1 2.5 2.5 1a4 4 0 0 1-6-3z"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  projector: '<rect x="3" y="6" width="18" height="10" rx="2"/><circle cx="15" cy="11" r="2.5"/><path d="M6 20h.01M18 20h.01M6 9h3"/>'
};
const icon = (n, cls = '') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ICONS.question}</svg>`;

/* ---------- registry ---------- */
const CATS = [
  { id: 'zaklady', title: 'Základy a první pomoc', tint: 1 },
  { id: 'ovladani', title: 'Ovládání počítače', tint: 2 },
  { id: 'soubory', title: 'Soubory a úložiště', tint: 4 },
  { id: 'aplikace', title: 'Programy a aplikace', tint: 5 },
  { id: 'bezpecne', title: 'Bezpečně online', tint: 3 },
  { id: 'pripojeni', title: 'Připojení a pojmy', tint: 6 }
];
const PAGES = [];
const WIDGETS = {};
const CFG = {};
function page(p) { p.sections.forEach(s => { s.text = strip(s.body); }); PAGES.push(p); }
const sec = (id, title, body) => ({ id, title, body });
const wd = (name, label = 'Vyzkoušej si', cfg = '') => `<div class="widget" data-widget="${name}" data-cfg="${cfg}"><div class="wlabel">${label}</div><div class="wbody"></div></div>`;
const note = (kind, label, html) => `<div class="note ${kind}"><b>${label}</b><div>${html}</div></div>`;
const tip = h => note('tip', 'Tip', h);
const warn = h => note('warn', 'Pozor', h);
const fact = h => note('fact', 'Věděl/a jsi?', h);
const W = h => `<div data-only="win">${h}</div>`;
const M = h => `<div data-only="mac">${h}</div>`;
const osLabel = (w, m) => `<p class="os-label" data-only="win">${w || 'Windows'}</p><p class="os-label" data-only="mac">${m || 'Mac'}</p>`;
function keysHtml(s) {
  if (!s || s === '—') return '<span class="mute">—</span>';
  return s.split(' / ').map(part => `<span class="keys">${part.split('+').map(k => `<kbd>${k === 'Plus' ? '+' : k === 'Minus' ? '−' : esc(k)}</kbd>`).join('<i>+</i>')}</span>`).join('<span class="keys"><span class="or">nebo</span></span>');
}
const K = (w, m) => m === undefined ? `<span data-only="win">${keysHtml(w)}</span><span data-only="mac">${keysHtml(w)}</span>` : `<span data-only="win">${keysHtml(w)}</span><span data-only="mac">${keysHtml(m)}</span>`;
const KW = w => `<span data-only="win">${keysHtml(w)}</span>`;

/* ---------- postup (hotová témata) ---------- */
let done = store.get('done', {});
function markDone(id) {
  if (done[id]) return;
  done[id] = true; store.set('done', done); updateXp();
}
function updateXp() {
  const n = PAGES.filter(p => done[p.id]).length;
  $('#xp').textContent = '★ ' + n + '/' + PAGES.length;
}

/* ---------- konfety ---------- */
function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#ffd43b', '#ff6b8b', '#3ddc97', '#6ec1ff', '#b79cff'];
  for (let i = 0; i < 46; i++) {
    const c = document.createElement('i'); c.className = 'conf';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.6 + Math.random() * 1.6 + 's'; c.style.animationDelay = Math.random() * .4 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);
  }
}

/* ---------- OS a téma ---------- */

/* ---------- hledání ---------- */
let INDEX = [];
function buildIndex() {
  INDEX = [];
  PAGES.forEach(p => {
    const cat = CATS.find(c => c.id === p.cat);
    INDEX.push({ id: p.id, sec: null, title: p.title, sub: p.lead, tn: norm(p.title), kn: norm(p.kw || ''), xn: norm(p.lead + ' ' + cat.title), page: true });
    p.sections.forEach(s => {
      INDEX.push({ id: p.id, sec: s.id, title: s.title, sub: p.title, tn: norm(s.title), kn: '', xn: norm(s.text), page: false });
    });
  });
}
function search(q) {
  const toks = norm(q).split(/[^a-z0-9+]+/).filter(Boolean);
  if (!toks.length) return [];
  const out = [];
  INDEX.forEach(e => {
    let score = 0;
    for (const t of toks) {
      let s = 0;
      const has = x => t.length > 1 ? x.includes(t) : new RegExp('(^|[^a-z0-9])' + t.replace(/[+]/g, '\\+') + '([^a-z0-9]|$)').test(x);
      if (has(e.tn)) s += 10;
      if (has(e.kn)) s += 7;
      if (has(e.xn)) s += 2;
      if (!s) { score = 0; break; }
      score += s;
    }
    if (score) { if (e.page) score += 4; out.push({ e, score }); }
  });
  out.sort((a, b) => b.score - a.score);
  return out.slice(0, 9).map(x => x.e);
}
let pendingSec = null;
function attachSearch(input, box) {
  let items = [], cur = -1;
  function draw() {
    const q = input.value.trim();
    if (!q) { box.hidden = true; return; }
    items = search(q); cur = items.length ? 0 : -1;
    box.hidden = false;
    box.innerHTML = items.length
      ? items.map((e, i) => `<a href="#${e.id}" data-sec="${e.sec || ''}" class="${i === 0 ? 'on' : ''}"><b>${esc(e.title)}</b><small>${e.page ? esc(e.sub) : 'v tématu: ' + esc(e.sub)}</small></a>`).join('')
      : `<div class="none">Nic jsme nenašli. Zkus jiné slovo (třeba „heslo“, „pdf“, „zkratky“) nebo otevři <a href="#" data-menu style="display:inline;padding:0;text-decoration:underline">Obsah</a>.</div>`;
  }
  const mark = () => $$('a', box).forEach((a, i) => a.classList.toggle('on', i === cur));
  input.addEventListener('input', draw);
  input.addEventListener('focus', draw);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) { cur = (cur + 1) % items.length; mark(); } }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { cur = (cur - 1 + items.length) % items.length; mark(); } }
    else if (e.key === 'Enter') { const a = $$('a', box)[cur]; if (a && a.getAttribute('href') !== '#') { e.preventDefault(); a.click(); } }
    else if (e.key === 'Escape') { box.hidden = true; input.blur(); }
  });
  box.addEventListener('click', e => {
    const m = e.target.closest('[data-menu]'); if (m) { e.preventDefault(); openMenu(); return; }
    const a = e.target.closest('a'); if (!a) return;
    pendingSec = a.dataset.sec || null; box.hidden = true; input.value = '';
    if (location.hash === a.getAttribute('href')) { e.preventDefault(); gotoSec(); }
  });
  document.addEventListener('click', e => { if (!box.contains(e.target) && e.target !== input) box.hidden = true; });
}
function gotoSec() {
  if (!pendingSec) { window.scrollTo(0, 0); return; }
  const t = document.getElementById('sec-' + pendingSec); pendingSec = null;
  if (t) t.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}

/* ---------- kvíz ---------- */
function quiz(root, items, pid) {
  let i = 0, score = 0;
  function draw() {
    const total = items.length;
    if (i >= total) {
      const pass = score >= Math.ceil(total * 0.7);
      root.innerHTML = `<div class="qdone pop"><div class="big">${score} / ${total}</div><p>${pass ? 'Skvělé! Tohle téma máš splněné.' : 'Skoro. Přečti si téma ještě jednou a zkus to znovu, určitě to dáš.'}</p><button class="btn primary" data-r>Zkusit znovu</button></div>`;
      if (pass) { markDone(pid); confetti(); refreshTileMarks(); }
      $('[data-r]', root).onclick = () => { i = 0; score = 0; draw(); };
      return;
    }
    const q = items[i];
    let opts = q.o.map((t, k) => ({ t, ok: k === q.a }));
    if (!q.fixed) opts = shuffle(opts);
    root.innerHTML = `<div class="qhead"><span>Otázka ${i + 1} / ${total}</span><span class="qbar"><i style="width:${i / total * 100}%"></i></span></div>${q.html ? `<div class="qmock">${q.html}</div>` : ''}<p class="qtext">${q.q}</p><div class="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}">${o.t}</button>`).join('')}</div><div class="qfb" aria-live="polite"></div>`;
    $$('.opt', root).forEach(b => b.onclick = () => {
      const o = opts[+b.dataset.k];
      $$('.opt', root).forEach((x, k) => { x.disabled = true; if (opts[k].ok) x.classList.add('right'); });
      if (!o.ok) b.classList.add('wrong'); else score++;
      const fb = $('.qfb', root);
      fb.innerHTML = `<p><b class="${o.ok ? 'ok' : 'no'}">${o.ok ? 'Správně!' : 'Ouha.'}</b> ${q.why || ''}</p><button class="btn primary small" data-n>${i + 1 >= total ? 'Výsledek' : 'Další →'}</button>`;
      $('[data-n]', fb).onclick = () => { i++; draw(); };
      $('[data-n]', fb).focus({ preventScroll: true });
    });
  }
  draw();
}

/* ---------- Vypnout / restart / spánek ---------- */
WIDGETS.shutdown = root => {
  const S = { days: 14, on: true, sleep: false, busy: false, say: 'Posuň jezdec: tak vypadá počítač, který se týdny jen „zaklapává“. Pak zkus tlačítka.' };
  const ram = () => S.on ? Math.min(98, Math.round(24 + S.days * 2.4)) : 0;
  function draw() {
    const r = ram(), speed = S.on ? Math.max(8, Math.round(100 - (r - 24) * 1.05)) : 0;
    const cls = r > 80 ? 'bad' : r > 55 ? 'mid' : '';
    root.innerHTML = `
    <div class="mon" style="margin-top:0"><div class="${S.on && !S.sleep ? 'lit2' : ''}" style="width:min(300px,80%)">${!S.on ? 'Vypnuto' : S.sleep ? 'Zzz… spí (RAM zůstává napájená)' : S.busy ? 'Restartuji…' : `Běží ${S.days} dní · otevřeno: 23 karet, Word, Teams, hra…`}</div></div>
    <div class="field"><label for="dy">Dní bez restartu: <b>${S.days}</b></label><input id="dy" type="range" min="0" max="30" value="${S.days}" ${S.on && !S.sleep ? '' : 'disabled'}></div>
    <div class="lab"><span>RAM (pracovní paměť)</span><span>${r} %</span></div><div class="meter ${cls}"><i style="width:${r}%"></i></div>
    <div class="lab"><span>Svižnost počítače</span><span>${speed} %</span></div><div class="meter ${speed < 45 ? 'bad' : speed < 75 ? 'mid' : ''}"><i style="width:${speed}%"></i></div>
    <div class="row" style="margin-top:1rem"><button class="btn" data-a="off" ${S.on && !S.sleep && !S.busy ? '' : 'disabled'}>Vypnout</button><button class="btn" data-a="restart" ${S.on && !S.sleep && !S.busy ? '' : 'disabled'}>Restartovat</button><button class="btn" data-a="sleep" ${S.on && !S.sleep && !S.busy ? '' : 'disabled'}>Uspat</button><button class="btn primary" data-a="wake" ${!S.on || S.sleep ? '' : 'disabled'}>${S.sleep ? 'Probudit' : 'Zapnout'}</button></div>
    <p class="say" aria-live="polite">${S.say}</p>`;
    const dy = $('#dy', root); if (dy) dy.oninput = () => { S.days = +dy.value; S.say = S.days > 20 ? 'Paměť je skoro plná. Programy se zpomalují a občas se něco zasekne. Čas na restart.' : 'RAM se postupně plní „zbytky“ po programech, které už nepotřebuješ.'; draw(); const n = $('#dy', root); n.focus(); };
    $$('[data-a]', root).forEach(b => b.onclick = () => act(b.dataset.a));
  }
  function act(a) {
    if (a === 'off') { S.on = false; S.say = 'Vypnuto. RAM se vyprázdnila, systém uložil nastavení a dokončil aktualizace. Příště začne čistě od nuly.'; }
    else if (a === 'sleep') { S.sleep = true; S.say = 'Spánek: RAM zůstává pod proudem, takže se probudíš za pár vteřin tam, kde jsi skončil/a. Jenže nic se nevyčistilo a při vybité baterii hrozí ztráta neuložené práce.'; }
    else if (a === 'wake') { if (S.sleep) { S.sleep = false; S.say = 'Probuzeno. Všechno je přesně jak před spánkem, včetně zahlcené paměti.'; } else { S.on = true; S.days = 0; S.say = 'Zapnuto. Čistý start: RAM má jen to nejnutnější, počítač je svižný.'; } }
    else if (a === 'restart') { S.busy = true; S.say = 'Restart = vypnutí a hned znovu zapnutí. Je to nejlepší „reset“ pro zasekaný nebo pomalý počítač.'; draw(); setTimeout(() => { S.busy = false; S.days = 0; S.say = 'Hotovo. Čistá paměť, nainstalované aktualizace, vše běží znovu od nuly.'; draw(); }, 1300); return; }
    draw();
  }
  draw();
};

WIDGETS.shortcutTrainer = root => {
  let q = [], i = 0, score = 0, fails = 0, t0 = 0, handler = null;
  const mods = ['Control', 'Shift', 'Alt', 'Meta', 'AltGraph', 'CapsLock', 'OS'];
  function intro() {
    stop();
    root.innerHTML = `<p>Tady mačkáš opravdové klávesy. Ukážu ti úkol a ty zmáčkneš správnou zkratku. 10 úkolů, měří se čas. <b>Na Macu klidně použij ⌘ místo Ctrl.</b></p><button class="btn primary" data-s>Spustit trénink</button>`;
    $('[data-s]', root).onclick = start;
  }
  function start() { q = shuffle(TRAIN).slice(0, 10); i = 0; score = 0; fails = 0; t0 = Date.now(); trainerOn = true; handler = ev; document.addEventListener('keydown', handler, true); draw(); }
  function stop() { trainerOn = false; if (handler) { document.removeEventListener('keydown', handler, true); handler = null; } }
  function draw(msg) {
    if (i >= q.length) {
      stop(); const sec = Math.round((Date.now() - t0) / 1000);
      root.innerHTML = `<div class="qdone pop"><div class="big">${sec} s</div><p>Dokončeno za ${sec} vteřin, ${score} z ${q.length} napoprvé správně.</p><button class="btn primary" data-s>Ještě jednou</button></div>`;
      $('[data-s]', root).onclick = start; if (score >= 7) confetti(); return;
    }
    const t = q[i];
    root.innerHTML = `<div class="qhead"><span>Úkol ${i + 1} / ${q.length}</span><span class="qbar"><i style="width:${i / q.length * 100}%"></i></span><button class="btn small" data-x>Konec (Esc)</button></div><p class="qtext" style="font-size:1.7rem;text-align:center;padding:1rem 0">${t.d}</p><p class="say" style="text-align:center" aria-live="polite">${msg || 'Zmáčkni zkratku. Klikání myší tu nepomůže.'}</p>`;
    $('[data-x]', root).onclick = intro;
  }
  function ev(e) {
    if (e.key === 'Escape') { e.preventDefault(); intro(); return; }
    if (mods.includes(e.key)) return;
    e.preventDefault(); e.stopPropagation();
    const t = q[i], mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
    const ok = mod && !e.altKey && t.opts.some(o => o.k === k && !!o.s === e.shiftKey);
    if (ok) { if (!fails) score++; fails = 0; i++; draw('✓ Správně!'); }
    else { fails++; const got = (e.ctrlKey ? 'Ctrl+' : '') + (e.metaKey ? '⌘+' : '') + (e.shiftKey ? 'Shift+' : '') + (e.altKey ? 'Alt+' : '') + (e.key.length === 1 ? e.key.toUpperCase() : e.key); draw(`Zmáčkl/a jsi ${esc(got)}. Zkus to znovu.${fails >= 2 ? ' Nápověda: ' + t.w : ''}`); }
  }
  intro();
  const obs = new MutationObserver(() => { if (!document.body.contains(root)) { stop(); obs.disconnect(); } });
  obs.observe(document.body, { childList: true, subtree: true });
};

WIDGETS.sheet = root => {
  const COLS = 'ABCDE', ROWS = 7;
  const D = { A1: 'Test 1', B1: '4', A2: 'Test 2', B2: '2', A3: 'Test 3', B3: '5', A4: 'Test 4', B4: '3', A5: 'Součet', B5: '=SUM(B1:B4)', A6: 'Průměr', B6: '=AVERAGE(B1:B4)', A7: 'Nejlepší', B7: '=MAX(B1:B4)' };

  const cell = r => String(D[r] ?? '');
  const colIdx = c => COLS.indexOf(c);
  function ref(r, depth) {
    const raw = cell(r); return calc(raw, depth + 1);
  }
  function nums(arg, depth) {
    const out = [];
    arg.split(/[;,]/).forEach(p => {
      const m = p.match(/^([A-E])(\d+):([A-E])(\d+)$/);
      if (m) { const c1 = colIdx(m[1]), c2 = colIdx(m[3]), r1 = +m[2], r2 = +m[4]; for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) { const v = ref(COLS[c] + r, depth); if (typeof v === 'number') out.push(v); } }
      else if (/^[A-E]\d+$/.test(p)) { const v = ref(p, depth); if (typeof v === 'number') out.push(v); }
      else if (p !== '' && !isNaN(+p.replace(',', '.'))) out.push(+p.replace(',', '.'));
    });
    return out;
  }
  function calc(raw, depth = 0) {
    if (depth > 20) return '#CYKLUS!';
    raw = raw.trim();
    if (raw[0] !== '=') { if (raw === '') return ''; const n = +raw.replace(',', '.'); return isNaN(n) ? raw : n; }
    let f = raw.slice(1).toUpperCase().replace(/\s+/g, '');
    let guard = 0;
    try {
      while (/([A-ZŮĚČŠŘŽÝÁÍÉÚŇŤĎÓ]+)\(([^()]*)\)/.test(f) && guard++ < 20) {
        f = f.replace(/([A-ZŮĚČŠŘŽÝÁÍÉÚŇŤĎÓ]+)\(([^()]*)\)/, (m, n, a) => {
          const k = FN[n]; if (!k) throw new Error('#NÁZEV?');
          const v = nums(a, depth); if (typeof v === 'string') throw new Error(v);
          if (k === 'C') return String(v.length);
          if (!v.length) throw new Error(k === 'A' ? '#DĚLENÍ_NULOU!' : '0');
          if (k === 'S') return String(v.reduce((x, y) => x + y, 0));
          if (k === 'A') return String(v.reduce((x, y) => x + y, 0) / v.length);
          if (k === 'MI') return String(Math.min(...v));
          return String(Math.max(...v));
        });
      }
      f = f.replace(/([A-E])(\d+)/g, (m, c, r) => { const v = ref(c + r, depth); if (typeof v === 'string' && v !== '') { throw new Error(v.startsWith('#') ? v : '#HODNOTA!'); } return '(' + (v === '' ? 0 : v) + ')'; });
      f = f.replace(/,/g, '.');

      const res = Function('"use strict";return (' + f + ')')();
      if (!isFinite(res)) return '#DĚLENÍ_NULOU!';
      return Math.round(res * 1e6) / 1e6;
    } catch (e) { return e.message.startsWith('#') ? e.message : '#CHYBA!'; }
  }
  const show = v => typeof v === 'number' ? v.toLocaleString('cs-CZ', { maximumFractionDigits: 2 }) : String(v);
  root.innerHTML = `<p style="margin-top:0">Klikni na buňku a přepiš ji. Vzorec začíná <code>=</code>. Zkus třeba změnit známku v B2 nebo do B5 napsat <code>=SUM(B1:B4)</code> (čeština zvládne i <code>=SUMA(B1:B4)</code>).</p>
  <div class="fbar"><b id="sn">B5</b><input id="sf" class="inp" aria-label="Obsah buňky"></div>
  <div class="sheet"><table><thead><tr><th class="rn"></th>${[...COLS].map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${Array.from({ length: ROWS }, (_, r) => `<tr><th class="rn">${r + 1}</th>${[...COLS].map(c => `<td><input data-r="${c}${r + 1}" aria-label="Buňka ${c}${r + 1}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="row" style="margin-top:.8rem"><span class="mute">Zkus vložit:</span><button class="chip" data-f="=B1+B2">=B1+B2</button><button class="chip" data-f="=SUM(B1:B4)*2">=SUM(B1:B4)*2</button><button class="chip" data-f="=B1/0">=B1/0 (chyba!)</button><button class="chip" data-f="=ABC(1)">=ABC(1) (neznámá funkce)</button></div><p class="say" id="shm">Tip: vzorec se přepočítá sám, kdykoli změníš čísla, na která odkazuje.</p>`;
  const inputs = $$('input[data-r]', root); let sel = 'B5';
  function paint() {

WIDGETS.pwd = root => {
  const COMMON = ['123456', '12345678', 'password', 'heslo', 'qwerty', 'qwertz', 'abc123', 'letmein', 'admin', 'iloveyou', 'kocka', 'praha', 'fotbal', 'jahoda', 'lenka', 'tomas', 'monika', 'sparta', 'slavia', 'matrix', 'dragon', 'monkey', 'heslo123', 'skola', 'ahoj', 'cau'];

  const inp = $('#pw', root);
  const fmt = s => s < 1 ? 'okamžitě' : s < 60 ? Math.round(s) + ' vteřin' : s < 3600 ? Math.round(s / 60) + ' minut' : s < 86400 ? Math.round(s / 3600) + ' hodin' : s < 31536000 ? Math.round(s / 86400) + ' dní' : s < 31536000e3 ? Math.round(s / 31536000).toLocaleString('cs-CZ') + ' let' : 'miliardy let';
  function draw() {
    const v = inp.value; let pool = 0;
    if (/[a-z]/.test(v)) pool += 26; if (/[A-Z]/.test(v)) pool += 26; if (/\d/.test(v)) pool += 10; if (/[^A-Za-z0-9]/.test(v)) pool += 32;
    let bits = v.length * Math.log2(pool || 1);
    const low = norm(v);
    if (/(.)\1{2,}/.test(v)) bits *= .7;
    if (/(123|234|345|456|abc|qwe|asd|zxc)/i.test(v)) bits *= .75;
    if (/^[A-Za-z]+\d{1,4}$/.test(v)) bits *= .7;
    if (/(19|20)\d\d$/.test(v)) bits = Math.min(bits, 30);
    if (COMMON.some(c => low.includes(c))) bits = Math.min(bits, 18);
    const words = v.split(/[-_ .]+/).filter(w => /^[A-Za-zÁ-ž]{3,}$/.test(w));
    if (words.length >= 2 && words.length === v.split(/[-_ .]+/).length) bits = Math.min(bits, words.length * 13);

    const secs = Math.pow(2, bits) / 2 / 1e10, pct = Math.min(100, Math.round(bits / 70 * 100));

    $('#ps', root).textContent = v ? lab : '—'; const m = $('#pm', root); m.className = 'meter ' + (bits < 28 ? 'bad' : bits < 45 ? 'mid' : ''); $('i', m).style.width = (v ? Math.max(pct, 4) : 0) + '%';
    const tips = []; if (v.length < 12) tips.push('Přidej délku. Radši 12 a víc znaků.'); if (COMMON.some(c => low.includes(c))) tips.push('Obsahuje často používané slovo nebo jméno. Zkoušejí se jako první.'); if (/(19|20)\d\d$/.test(v)) tips.push('Rok narození na konci uhodne útočník bleskově.'); if (!tips.length && bits >= 60) tips.push('Skvělé. Hlavně ho nepoužívej na víc webech.');
    $('#pt', root).innerHTML = v ? `Odhad: počítačem by se prolomilo za <b>${fmt(secs)}</b> (při rychlém útoku na uniklou databázi). ${tips.join(' ')}` : 'Napiš nějaké heslo.';
  }
  inp.oninput = draw; draw();
  $('#pg', root).onclick = () => {
    const A = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!?#%+-='; const a = new Uint32Array(16); (crypto || window.crypto).getRandomValues(a);

  };
};

WIDGETS.glossary = root => {
  root.innerHTML = `<div class="field" style="margin-top:0"><label for="gq">Hledat pojem</label><input id="gq" class="inp" type="search" placeholder="např. RAM, phishing, cloud…" autocomplete="off"></div><p class="mute" style="margin:0">Klikni na kartu a otočí se na vysvětlení.</p><div class="gl" id="gl"></div>`;
  const gl = $('#gl', root); let open = new Set();
  function draw() {
    const nq = norm($('#gq', root).value);
    const rows = GLOSS.filter(g => !nq || norm(g[0] + ' ' + g[1]).includes(nq));
    gl.innerHTML = rows.map(g => `<button class="gcard" aria-pressed="${open.has(g[0])}" data-t="${esc(g[0])}"><span><b>${g[0]}</b><small>Klikni pro vysvětlení</small><span class="def">${g[1]}</span></span></button>`).join('') || '<p class="mute">Takový pojem tu zatím není.</p>';
    $$('.gcard', gl).forEach(c => c.onclick = () => { const t = c.dataset.t; open.has(t) ? open.delete(t) : open.add(t); c.setAttribute('aria-pressed', String(open.has(t))); });
  }
  $('#gq', root).oninput = draw; draw();
};

/* =========================================================
   Start aplikace + ozvěna kláves na úvodní stránce
   ========================================================= */
const KEYNAMES = { ' ': 'Mezerník', ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', Escape: 'Esc', Control: 'Ctrl', Meta: '⌘', Shift: 'Shift', Alt: 'Alt', Enter: 'Enter', Backspace: 'Backspace', Delete: 'Delete', Tab: 'Tab' };
const SCLOOK = {};
SC.forEach(r => { if (r[1].indexOf(' / ') < 0 && r[1].indexOf('Šipka') < 0) SCLOOK[r[1].toLowerCase().replace('esc', 'escape').replace('plus', '+')] = r[3]; });
function initKeyEcho() {
  document.addEventListener('keydown', e => {
    const box = document.getElementById('kecho');
    if (!box || trainerOn) return;
    const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    const parts = [];
    if (e.ctrlKey) parts.push('Ctrl'); if (e.metaKey) parts.push('⌘'); if (e.altKey) parts.push('Alt'); if (e.shiftKey) parts.push('Shift');
    if (!['Control', 'Meta', 'Shift', 'Alt'].includes(e.key)) parts.push(KEYNAMES[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : e.key));
    if (!parts.length) return;
    const combo = parts.map(p => p === '⌘' ? 'ctrl' : p.toLowerCase()).join('+');
    const desc = SCLOOK[combo] || SCLOOK[combo.replace(/^ctrl\+shift\+/, 'ctrl+shift+')];
    box.innerHTML = `<span class="keys">${parts.map(p => `<kbd>${esc(p)}</kbd>`).join('<i>+</i>')}</span>${desc ? `<span class="what">= ${desc}</span>` : '<span class="hintt">Zkus nějakou zkratku, třeba Ctrl+C nebo Ctrl+Z.</span>'}`;
  });
}
function boot() {
  buildIndex(); buildMenu(); initOs(); initTheme(); updateXp();
  attachSearch($('#q'), $('#hres'));
  $('#menuBtn').addEventListener('click', () => $('#menu').hidden ? openMenu() : closeMenu());
  $('#menuClose').addEventListener('click', closeMenu);
  document.addEventListener('keydown', e => {
    const t = e.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (e.key === 'Escape' && !$('#menu').hidden) { closeMenu(); return; }
    if (!typing && !trainerOn && e.key === '/' ) { e.preventDefault(); $('#q').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && !trainerOn) { e.preventDefault(); $('#q').focus(); }
  });
  initKeyEcho();
  window.addEventListener('hashchange', route);
  route();
}
boot();
